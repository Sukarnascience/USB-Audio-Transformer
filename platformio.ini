; STM32 UAC Voice Modulator
; Board  : STM32F407G-DISC1 (MB997E)
;
; USB middleware sources (usbd_core.c, usbd_ctlreq.c, usbd_ioreq.c)
; are copied into src/usb_core/ so no path gymnastics needed.

[env:disco_f407vg]
platform                  = ststm32
board                     = disco_f407vg
framework                 = stm32cube

upload_protocol           = stlink
debug_tool                = stlink

monitor_speed             = 115200

build_flags =
    -DUSE_HAL_DRIVER
    -DSTM32F407xx
    -DHSE_VALUE=8000000U
    -Wall
    -Iinclude
; STM32 UAC Voice Modulator
; Board  : STM32F407G-DISC1 (MB997E)
; Target : STM32F407VGTx

[env:disco_f407vg]
platform                  = ststm32
board                     = disco_f407vg
framework                 = stm32cube

upload_protocol           = stlink
debug_tool                = stlink

monitor_speed             = 115200

build_flags =
    -DUSE_HAL_DRIVER
    -DSTM32F407xx
    -DHSE_VALUE=8000000U
    -Wall